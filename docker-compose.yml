services:
  wand:
    build: .
    image: harbor.infra/library/wand-portal:1.0.0
    container_name: wand-portal
    restart: unless-stopped
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - ./data:/data
      - ./config.yaml:/config/config.yaml:ro
    ports:
      - "8080:8080"
    environment:
      WAND_MQTT_HOST: 192.168.0.40
      WAND_MQTT_USERNAME: ""
      WAND_MQTT_PASSWORD: ""
    # A USB camera can't be scheduled across a swarm — pin this to the node
    # the camera is plugged into if you deploy it as a stack.
    # deploy:
    #   placement:
    #     constraints: [node.hostname == compute-node-01]
